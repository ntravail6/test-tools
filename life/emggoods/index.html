<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <title>防災グッズリスト</title>
    <style>
        :root {
            --primary: #2e7d5e;
            --primary-light: #e6f4ee;
            --accent: #c0392b;
            --accent-light: #fdecea;
            --bg: #f5f3ef;
            --card: #ffffff;
            --text: #1e2d3a;
            --text-sub: #7a8e9a;
            --sub: #9aa8b2;
            --border: #e2ddd8;
            --success: #2e7d5e;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Quicksand', 'Kosugi Maru', 'Arial Rounded MT Bold', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding-bottom: 230px;
        }

        .header {
            position: sticky; top: 0; z-index: 100;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.3px; color: var(--text); }
        .app-title span { color: var(--primary); }
        .header-actions { display: flex; gap: 6px; }

        .progress-bar-wrap {
            margin-top: 9px;
            background: var(--border);
            border-radius: 99px;
            height: 7px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            border-radius: 99px;
            background: var(--primary);
            transition: width 0.4s ease;
        }
        .progress-label {
            display: flex; justify-content: space-between;
            margin-top: 4px;
            font-size: 0.65rem; font-weight: 700; color: var(--text-sub);
        }

        .icon-btn {
            display: flex; align-items: center; gap: 4px;
            padding: 5px 10px; border: 1.5px solid var(--border);
            border-radius: 8px; background: white; color: var(--text-sub);
            font-size: 0.75rem; font-weight: 700; cursor: pointer; white-space: nowrap;
        }
        .icon-btn.accent { border-color: var(--accent); color: var(--accent); }

        .container { max-width: 960px; margin: 0 auto; padding: 12px 14px 0; }

        .cat-section { margin-bottom: 6px; }

        .cat-header {
            display: flex; align-items: center; gap: 8px;
            padding: 9px 12px; background: var(--card);
            border: 1.5px solid var(--border); border-radius: var(--radius);
            margin-bottom: 4px; cursor: pointer; user-select: none;
        }

        .cat-badge { font-size: 0.65rem; font-weight: 800; padding: 2px 7px; border-radius: 99px; letter-spacing: 0.3px; }
        .badge-0 { background: #fde0db; color: #c04b2f; }
        .badge-1 { background: #d4ebf2; color: #2a7a96; }
        .badge-2 { background: #fdefd0; color: #b8780a; }
        .badge-3 { background: #e2d4f2; color: #6b3a9a; }
        .badge-4 { background: #d4eee4; color: #1e6b47; }
        .badge-5 { background: #e0e0e0; color: #555; }

        .cat-label { font-size: 0.88rem; font-weight: 700; flex: 1; }
        .cat-count { font-size: 0.72rem; color: var(--text-sub); font-weight: 600; }
        .cat-arrow { font-size: 0.65rem; color: var(--text-sub); transition: transform 0.25s; }
        .cat-section.open .cat-arrow { transform: rotate(180deg); }
        .cat-items { display: none; }
        .cat-section.open .cat-items { display: block; }

        .item-card {
            display: flex; align-items: center; gap: 10px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 10px; padding: 10px 10px 10px 12px;
            margin-bottom: 3px; transition: background 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .item-card.checked { background: #f0faf5; border-color: #b2dcc9; }
        .item-card:active { background: #f0f0f0; }

        .check-btn {
            width: 36px; height: 36px; border-radius: 50%;
            border: 2px solid var(--border); background: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; cursor: pointer; flex-shrink: 0;
            transition: all 0.2s; color: transparent;
        }
        .item-card.checked .check-btn {
            background: var(--primary); border-color: var(--primary); color: white;
        }

        .item-body { flex: 1; min-width: 0; }
        .item-name  { font-size: 0.9rem; font-weight: 700; line-height: 1.3; }
        .item-card.checked .item-name { text-decoration: line-through; color: var(--text-sub); }
        .item-qty   { font-size: 0.72rem; color: var(--primary); font-weight: 700; margin-top: 2px; }
        .item-note  { font-size: 0.68rem; color: var(--text-sub); margin-top: 2px; line-height: 1.4; }

        .item-actions { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }

        .delete-btn {
            background: none; border: none; color: #ccc;
            font-size: 1.1rem; padding: 2px 4px; cursor: pointer; line-height: 1; text-align: center;
        }
        .delete-btn:hover { color: var(--accent); }

        .empty-cat { text-align: center; padding: 14px; font-size: 0.75rem; color: var(--text-sub); font-weight: 600; }

        .save-notice {
            display: flex; align-items: flex-start; gap: 8px;
            background: var(--primary-light); border: 1px solid var(--primary);
            border-radius: 10px; padding: 9px 12px; margin-bottom: 10px;
            font-size: 0.65rem; color: var(--primary); line-height: 1.6;
        }
        .save-notice .notice-icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }

        .bottom-panel {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; border-top: 1px solid var(--border);
            padding: 10px 14px 16px;
        }
        .panel-inner { max-width: 960px; margin: 0 auto; }

        .add-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 5px; }
        .add-row  { display: flex; gap: 5px; }

        .cat-select {
            width: 80px; padding: 8px 4px; border: 1.5px solid var(--border);
            border-radius: 9px; font-size: 0.78rem; font-weight: 700;
            color: var(--text); background: white; flex-shrink: 0; text-align: center;
            font-family: 'Quicksand', 'Kosugi Maru', sans-serif;
        }

        .add-input {
            flex: 1; padding: 8px 10px; border: 1.5px solid var(--border);
            border-radius: 9px; font-size: 0.83rem; color: var(--text);
            background: white; min-width: 0;
            font-family: 'Quicksand', 'Kosugi Maru', sans-serif;
        }
        .add-input:focus, .cat-select:focus { outline: none; border-color: var(--primary); }

        .add-submit {
            padding: 8px 14px; background: var(--primary); color: white;
            border: none; border-radius: 9px; font-size: 0.85rem; font-weight: 800;
            cursor: pointer; flex-shrink: 0;
            font-family: 'Quicksand', 'Kosugi Maru', sans-serif;
        }

        .action-row {
            display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 6px; margin-bottom: 8px;
        }

        .action-btn {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            padding: 7px 4px; border-radius: 10px; border: 1.5px solid var(--border);
            background: white; cursor: pointer; font-size: 0.62rem; font-weight: 700;
            color: var(--text-sub); font-family: 'Quicksand', 'Kosugi Maru', sans-serif;
        }
        .action-btn .icon { font-size: 1.1rem; line-height: 1; }
        .action-btn.hi     { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        .action-btn.danger { border-color: var(--accent);  color: var(--accent);  background: var(--accent-light); }

        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.35); z-index: 200;
            align-items: center; justify-content: center;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            background: white; border-radius: 16px; padding: 20px;
            width: calc(100% - 32px); max-width: 420px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
        }
        .modal h3 { font-size: 0.95rem; font-weight: 800; margin-bottom: 14px; color: var(--text); }

        .modal-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
        .modal-field label { font-size: 0.7rem; font-weight: 700; color: var(--text-sub); }
        .modal-field input, .modal-field select, .modal-field textarea {
            padding: 8px 10px; border: 1.5px solid var(--border);
            border-radius: 9px; font-size: 0.85rem; color: var(--text);
            font-family: 'Quicksand', 'Kosugi Maru', sans-serif;
        }
        .modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus {
            outline: none; border-color: var(--primary);
        }
        .modal-field textarea { resize: none; height: 56px; }

        .modal-btns { display: flex; gap: 8px; margin-top: 14px; }
        .modal-btns button {
            flex: 1; padding: 10px; border-radius: 10px;
            font-size: 0.85rem; font-weight: 800; cursor: pointer; border: none;
            font-family: 'Quicksand', 'Kosugi Maru', sans-serif;
        }
        .btn-cancel { background: var(--bg); color: var(--text-sub); border: 1.5px solid var(--border) !important; }
        .btn-save   { background: var(--primary); color: white; }

        .disclaimer {
            background: #fffbe6;
            border-bottom: 1px solid #f0c040;
            padding: 8px 16px;
            text-align: center;
            font-size: 0.72rem;
            font-weight: 700;
            color: #7a5f00;
        }

        .site-footer {
            text-align: center;
            padding: 20px 16px 32px;
            font-size: 0.65rem;
            color: var(--sub);
            opacity: 0.7;
            letter-spacing: 0.8px;
        }

        .summary-bar {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
        }
        .summary-bar-inner {
            max-width: 960px;
            margin: 0 auto;
        }

        .view-table { display: block; }
        .view-cards { display: none; }
        @media (max-width: 650px) {
            .view-table { display: none !important; }
            .view-cards { display: block !important; }
        }

        .items-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: var(--radius); overflow: hidden; border: 1.5px solid var(--border); margin-bottom: 6px; }
        .items-table thead th { background: #f0ece7; padding: 9px 12px; font-size: 0.75rem; font-weight: 800; color: var(--text-sub); text-align: left; border-bottom: 1.5px solid var(--border); white-space: nowrap; }
        .items-table tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
        .items-table tbody tr:last-child { border-bottom: none; }
        .items-table tbody tr:hover { background: #f8f8f6; }
        .items-table tbody tr.checked-row { background: #f0faf5; }
        .items-table tbody td { padding: 9px 12px; font-size: 0.85rem; vertical-align: middle; }
        .items-table .cat-row td { background: #f0ece7; font-size: 0.75rem; font-weight: 800; color: var(--text-sub); padding: 6px 12px; }
        .items-table .name-cell { font-weight: 700; }
        .items-table .name-cell.done { text-decoration: line-through; color: var(--text-sub); }
        .items-table .qty-cell { color: var(--primary); font-weight: 700; font-size: 0.8rem; white-space: nowrap; }
        .items-table .note-cell { color: var(--text-sub); font-size: 0.75rem; }

        @media print {
            .header .header-actions, .bottom-panel, .modal-overlay { display: none !important; }
            body { padding-bottom: 0; }
            .container { padding-top: 16px; }
            .cat-items { display: block !important; }
            .item-actions { display: none !important; }
            .progress-bar-wrap, .progress-label, .save-notice { display: none !important; }
        }
    </style>
</head>
<body>

<div class="disclaimer">⚠️ 本リストは参考情報です。実際の備蓄内容は各自治体のガイドラインや家族構成に合わせてご確認ください。</div>

<div class="header">
    <div class="header-top">
        <div class="app-title">🎒 <span>防災</span>グッズリスト</div>
        <div class="header-actions">
            <button class="icon-btn" onclick="exportData()">📤 バックアップ</button>
            <button class="icon-btn accent" onclick="document.getElementById('import-file').click()">📥 復元</button>
            <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
        </div>
    </div>
    </div>

<div class="summary-bar">
    <div class="summary-bar-inner">
        <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
        </div>
        <div class="progress-label">
            <span id="progress-text">準備済み 0 / 0 点</span>
            <span id="progress-pct">0%</span>
        </div>
    </div>
</div>

<div class="container">
    <div class="save-notice">
        <span class="notice-icon">💾</span>
        <span>チェック状態は<strong>自動保存</strong>されます（このブラウザ・端末のみ）。<br>別の端末に引き継ぐには「バックアップ」からJSONファイルを保存してください。</span>
    </div>
    <div id="list-container">
        <div id="view-table" class="view-table"></div>
        <div id="view-cards" class="view-cards"></div>
    </div>
</div>

<footer class="site-footer">© 2026 enu(エヌ) All rights reserved.</footer>

<div class="bottom-panel">
    <div class="panel-inner">
        <div class="add-grid">
            <input class="add-input" type="text" id="new-name"  placeholder="📦 グッズ名（例：懐中電灯）">
            <input class="add-input" type="text" id="new-qty"   placeholder="数量（例：1個）">
        </div>
        <div class="add-row" style="margin-bottom:8px;">
            <select class="cat-select" id="new-cat">
                <option value="水・食料">水・食料</option>
                <option value="救急・医療">救急・医療</option>
                <option value="情報・通信">情報・通信</option>
                <option value="生活・衛生用品">衛生用品</option>
                <option value="避難・移動">避難・移動</option>
                <option value="貴重品・書類">貴重品・書類</option>
                <option value="その他">その他</option>
            </select>
            <input class="add-input" type="text" id="new-note" placeholder="メモ（例：ローリングストック）">
            <button class="add-submit" onclick="addItem()">追加</button>
        </div>
        <div class="action-row">
            <button class="action-btn" onclick="window.print()">
                <span class="icon">🖨️</span>印刷
            </button>
            <button class="action-btn" onclick="shareList()">
                <span class="icon">🔗</span>共有
            </button>
            <button class="action-btn hi" onclick="window.print()">
                <span class="icon">📄</span>PDF保存
            </button>
            <button class="action-btn danger" onclick="resetAll()">
                <span class="icon">🔄</span>全削除
            </button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="detail-modal">
    <div class="modal">
        <h3>📝 グッズを編集</h3>
        <div class="modal-field">
            <label>グッズ名 *</label>
            <input type="text" id="m-name" placeholder="懐中電灯">
        </div>
        <div class="modal-field">
            <label>数量</label>
            <input type="text" id="m-qty" placeholder="1個、3日分 など">
        </div>
        <div class="modal-field">
            <label>カテゴリ</label>
            <select id="m-cat">
                <option value="水・食料">水・食料</option>
                <option value="救急・医療">救急・医療</option>
                <option value="情報・通信">情報・通信</option>
                <option value="生活・衛生用品">生活・衛生用品</option>
                <option value="避難・移動">避難・移動</option>
                <option value="貴重品・書類">貴重品・書類</option>
                <option value="その他">その他</option>
            </select>
        </div>
        <div class="modal-field">
            <label>メモ</label>
            <textarea id="m-note" placeholder="ローリングストック、期限確認など"></textarea>
        </div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
            <button class="btn-save"   onclick="saveModal()">保存</button>
        </div>
    </div>
</div>

        { cat: "生活・衛生用品", name: "生理用品・紙おむつ",        qty: "必要量",  checked: false, note: "家族構成に合わせて備蓄" },
        { cat: "生活・衛生用品", name: "防寒シート（アルミシート）", qty: "人数分", checked: false, note: "体温維持。コンパクトで軽量" },
        { cat: "生活・衛生用品", name: "着替え・タオル",            qty: "数日分",  checked: false, note: "防寒用の上着も含めて" },
        { cat: "生活・衛生用品", name: "ポリ袋・ゴミ袋（大）",      qty: "10枚以上", checked: false, note: "トイレ袋・防水・収納と多用途" },
        { cat: "生活・衛生用品", name: "新聞紙",                    qty: "数日分",  checked: false, note: "保温・食器代わり・緩衝材と万能" },
        { cat: "生活・衛生用品", name: "使い捨てカイロ",            qty: "10個以上", checked: false, note: "冬季災害・低体温症予防に必須" },
        // 避難・移動
        { cat: "避難・移動", name: "防災リュック（非常用持出袋）", qty: "人数分",   checked: false, note: "中身込みで15kg以内を目安に" },
        { cat: "避難・移動", name: "ヘルメット・防災頭巾",        qty: "人数分",   checked: false, note: "落下物・転倒時の頭部保護" },
        { cat: "避難・移動", name: "軍手・作業手袋",              qty: "人数分",   checked: false, note: "滑り止め付きがおすすめ。ガラス片対策" },
        { cat: "避難・移動", name: "防塵ゴーグル",                qty: "人数分",   checked: false, note: "粉じん・煙から目を守る" },
        { cat: "避難・移動", name: "雨具・折りたたみ傘",          qty: "人数分",   checked: false, note: "避難中に雨に降られることも多い" },
        { cat: "避難・移動", name: "地域のハザードマップ（印刷）", qty: "1部",     checked: false, note: "避難場所・経路を事前に確認" },
        // 貴重品・書類
        { cat: "貴重品・書類", name: "現金（小銭含む）",             qty: "数万円",  checked: false, note: "停電時は電子決済不可。小銭も重要" },
        { cat: "貴重品・書類", name: "通帳・保険証のコピー",         qty: "1式",     checked: false, note: "防水袋に入れて保管" },
        { cat: "貴重品・書類", name: "マイナンバーカード・免許証",   qty: "人数分",  checked: false, note: "身分証明として避難所で必要な場合あり" },
        { cat: "貴重品・書類", name: "家族写真・連絡先メモ",         qty: "1枚",     checked: false, note: "スマホ紛失時の安否確認用" },
        { cat: "貴重品・書類", name: "印鑑",                         qty: "1本",     checked: false, note: "罹災証明書など行政手続き用" },
        { cat: "貴重品・書類", name: "重要書類のUSB・SDバックアップ", qty: "1個",    checked: false, note: "写真・権利証・年金手帳などのデータ" },
    ];

    function loadStorage(key, fallback) {
        try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
    }
    function saveStorage(key, val) {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
    }

    let items     = loadStorage('bousai_items', defaultData);
    let openState = loadStorage('bousai_open', { "水・食料": true, "避難・移動": true });
    let editingIdx = null;

    function updateProgress() {
        const total   = items.length;
        const done    = items.filter(i => i.checked).length;
        const pct     = total > 0 ? Math.round(done / total * 100) : 0;
        document.getElementById('progress-fill').style.width = pct + '%';
        document.getElementById('progress-text').textContent = `準備済み ${done} / ${total} 点`;
        document.getElementById('progress-pct').textContent  = pct + '%';
    }

    function render() {
        // ── スマホ：カード ──
        const cardsEl = document.getElementById('view-cards');
        cardsEl.innerHTML = '';

        // ── PC：テーブル ──
        const tableEl = document.getElementById('view-table');
        const table = document.createElement('table');
        table.className = 'items-table';
        table.innerHTML = `<thead><tr>
            <th style="width:36px"></th>
            <th>グッズ名</th>
            <th style="width:100px">カテゴリ</th>
            <th style="width:120px">数量</th>
            <th>メモ</th>
            <th style="width:60px">操作</th>
        </tr></thead>`;
        const tbody = document.createElement('tbody');

        CATS.forEach(cat => {
            const catItems  = items.filter(i => i.cat === cat);
            const meta      = CAT_META[cat] || { badge: cat, cls: '', emoji: '📦' };
            const isOpen    = !!openState[cat];
            const doneCount = catItems.filter(i => i.checked).length;

            // カード生成（スマホ用）
            const section = document.createElement('div');
            section.className = `cat-section ${isOpen ? 'open' : ''}`;
            const hdr = document.createElement('div');
            hdr.className = 'cat-header';
            hdr.innerHTML = `
                <span class="cat-badge ${meta.cls}">${meta.badge}</span>
                <span class="cat-label">${meta.emoji} ${cat}</span>
                <span class="cat-count">${doneCount}/${catItems.length}件</span>
                <span class="cat-arrow">▼</span>
            `;
            hdr.onclick = () => {
                openState[cat] = !openState[cat];
                saveStorage('bousai_open', openState);
                render();
            };
            const itemsDiv = document.createElement('div');
            itemsDiv.className = 'cat-items';
            if (catItems.length === 0) {
                itemsDiv.innerHTML = `<div class="empty-cat">まだ登録されていません</div>`;
            } else {
                catItems.forEach(item => {
                    const idx = items.indexOf(item);
                    const card = document.createElement('div');
                    card.className = `item-card ${item.checked ? 'checked' : ''}`;
                    card.innerHTML = `
                        <button class="check-btn" onclick="toggleCheck(${idx})" title="${item.checked ? '未準備に戻す' : '準備済みにする'}">✓</button>
                        <div class="item-body">
                            <div class="item-name">${item.name}</div>
                            ${item.qty  ? `<div class="item-qty">📦 ${item.qty}</div>` : ''}
                            ${item.note ? `<div class="item-note">${item.note}</div>` : ''}
                        </div>
                        <div class="item-actions">
                            <button class="delete-btn" onclick="event.stopPropagation(); openEdit(${idx})" title="編集">✏️</button>
                            <button class="delete-btn" onclick="event.stopPropagation(); removeItem(${idx})" title="削除">×</button>
                        </div>
                    `;
                    itemsDiv.appendChild(card);
                });
            }
            section.appendChild(hdr);
            section.appendChild(itemsDiv);
            cardsEl.appendChild(section);

            // テーブル行生成（PC用）
            if (catItems.length > 0) {
                const catTr = document.createElement('tr');
                catTr.className = 'cat-row';
                catTr.innerHTML = `<td colspan="6">${meta.emoji} ${cat}　${doneCount}/${catItems.length}件</td>`;
                tbody.appendChild(catTr);
                catItems.forEach(item => {
                    const idx = items.indexOf(item);
                    const tr = document.createElement('tr');
                    tr.className = item.checked ? 'checked-row' : '';
                    tr.innerHTML = `
                        <td><button class="check-btn" style="width:28px;height:28px;font-size:0.85rem" onclick="toggleCheck(${idx})">✓</button></td>
                        <td class="name-cell ${item.checked ? 'done' : ''}">${item.name}</td>
                        <td><span class="cat-badge ${meta.cls}">${meta.badge}</span></td>
                        <td class="qty-cell">${item.qty || '—'}</td>
                        <td class="note-cell">${item.note || ''}</td>
                        <td style="white-space:nowrap">
                            <button class="delete-btn" onclick="openEdit(${idx})" title="編集">✏️</button>
                            <button class="delete-btn" onclick="removeItem(${idx})" title="削除">×</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        });

        table.appendChild(tbody);
        tableEl.innerHTML = '';
        tableEl.appendChild(table);

        updateProgress();
    }

    function save() {
        saveStorage('bousai_items', items);
        saveStorage('bousai_open', openState);
    }

    window.toggleCheck = idx => {
        items[idx].checked = !items[idx].checked;
        save(); render();
    };

    window.addItem = () => {
        const name = document.getElementById('new-name').value.trim();
        const qty  = document.getElementById('new-qty').value.trim();
        const cat  = document.getElementById('new-cat').value;
        const note = document.getElementById('new-note').value.trim();
        if (!name) { alert('グッズ名は必須です。'); return; }
        items.push({ cat, name, qty, note, checked: false });
        openState[cat] = true;
        document.getElementById('new-name').value = '';
        document.getElementById('new-qty').value  = '';
        document.getElementById('new-note').value = '';
        save(); render();
    };

    window.removeItem = idx => {
        if (!confirm(`「${items[idx].name}」を削除しますか？`)) return;
        items.splice(idx, 1);
        save(); render();
    };

    window.openEdit = idx => {
        editingIdx = idx;
        const c = items[idx];
        document.getElementById('m-name').value = c.name;
        document.getElementById('m-qty').value  = c.qty  || '';
        document.getElementById('m-cat').value  = c.cat;
        document.getElementById('m-note').value = c.note || '';
        document.getElementById('detail-modal').classList.add('open');
    };

    window.closeModal = () => {
        document.getElementById('detail-modal').classList.remove('open');
        editingIdx = null;
    };

    window.saveModal = () => {
        const name = document.getElementById('m-name').value.trim();
        if (!name) { alert('グッズ名は必須です。'); return; }
        const obj = {
            name,
            qty:     document.getElementById('m-qty').value.trim(),
            cat:     document.getElementById('m-cat').value,
            note:    document.getElementById('m-note').value.trim(),
            checked: editingIdx !== null ? items[editingIdx].checked : false,
        };
        if (editingIdx !== null) {
            items[editingIdx] = obj;
        } else {
            items.push(obj);
            openState[obj.cat] = true;
        }
        closeModal();
        save(); render();
    };

    window.resetAll = () => {
        if (!confirm('登録済みのグッズをすべて削除しますか？')) return;
        items = [];
        save(); render();
    };

    function exportData() {
        const blob = new Blob([JSON.stringify({ items }, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '防災グッズリスト.json';
        a.click();
    }

    window.importData = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const data = JSON.parse(ev.target.result);
                items = data.items;
                save(); render();
                alert('読み込み完了！');
            } catch {
                alert('ファイルが正しくありません');
            }
        };
        reader.readAsText(file);
        e.target.value = '';
    };

    function shareList() {
        const lines = items.map(i =>
            `【${i.cat}】${i.checked ? '✅' : '⬜'} ${i.name}${i.qty ? '　' + i.qty : ''}${i.note ? '　' + i.note : ''}`
        );
        const text = '🎒 防災グッズリスト\n' + lines.join('\n');
        if (navigator.share) {
            navigator.share({ title: '防災グッズリスト', text });
        } else {
            navigator.clipboard.writeText(text).then(() => alert('リストをコピーしました！'));
        }
    }

    ['new-name', 'new-qty', 'new-note'].forEach(id => {
        document.getElementById(id).addEventListener('keydown', e => {
            if (e.key === 'Enter') addItem();
        });
    });

    document.getElementById('detail-modal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    render();
</script>
</body>
</html>
