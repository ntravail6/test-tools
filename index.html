<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>enu-tools_test | スプレッドシート家計簿</title>
    <style>
        /* デザインはそのまま維持 */
        :root { --bg-color: #fdfaf6; --card-bg: #ffffff; --accent-color: #e2b0b0; --text-color: #5a5a5a; --input-bg: #fafafa; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background-color: var(--card-bg); width: 100%; max-width: 380px; padding: 25px; border-radius: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.03); }
        h1 { font-size: 1.3rem; text-align: center; color: var(--accent-color); margin-bottom: 20px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 6px; font-weight: bold; color: #888; }
        input, select { width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 12px; box-sizing: border-box; background-color: var(--input-bg); }
        .btn-stack { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        button { width: 100%; padding: 14px; border: none; border-radius: 14px; font-weight: bold; cursor: pointer; }
        .btn-auth { background-color: transparent; border: 2px solid var(--accent-color); color: var(--accent-color); }
        .btn-save { background-color: var(--accent-color); color: white; }
        button:disabled { background-color: #eee; color: #ccc; }
        #status-log { margin-top: 20px; text-align: center; font-size: 0.75rem; color: #bbb; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎀 enu-kakeibo_test</h1>

    <div class="input-group">
        <label>カテゴリー</label>
        <select id="category">
            <option value="食費">🍴 食費</option>
            <option value="日用品">🏠 日用品</option>
            <option value="美容・健康">💄 美容・健康</option>
            <option value="カフェ・交際費">☕ カフェ・交際費</option>
            <option value="その他">✨ その他</option>
        </select>
    </div>

    <div class="input-group">
        <label>内容</label>
        <input type="text" id="memo" placeholder="なにを買った？">
    </div>

    <div class="input-group">
        <label>金額</label>
        <input type="number" id="price" placeholder="0">
    </div>

    <div class="btn-stack">
        <button class="btn-auth" onclick="handleAuth()">1. Googleと連携する 🔑</button>
        <button id="save-btn" class="btn-save" onclick="handleSave()" disabled>2. スプレッドシートに保存 📊</button>
    </div>

    <div id="status-log">ステータス: 準備完了 🌸</div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
    // ★ 自分の情報を入れてね ★
    const CLIENT_ID = '667616783231-j9moigr818lai3i5h2vlpuenb3fj22qn.apps.googleusercontent.com';
    const SPREADSHEET_ID = 'ここにスプレッドシートIDを貼り付け！'; 

    let tokenClient;
    let accessToken = null;

    window.onload = function() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            // スコープをスプレッドシート用に変更
            scope: 'https://www.googleapis.com/auth/spreadsheets',
            callback: (tokenResponse) => {
                accessToken = tokenResponse.access_token;
                document.getElementById('save-btn').disabled = false;
                document.getElementById('status-log').innerText = '連携完了 ✨ シートに書き込めます';
            },
        });
    };

    function handleAuth() {
        tokenClient.requestAccessToken();
    }

    async function handleSave() {
        const category = document.getElementById('category').value;
        const memo = document.getElementById('memo').value;
        const price = document.getElementById('price').value;
        const date = new Date().toLocaleString('ja-JP');

        if(!price) { alert('金額を入れてね 🧸'); return; }
        document.getElementById('status-log').innerText = 'シートに書き込み中... ⏳';

        // スプレッドシートに送るデータの形
        const values = [
            [date, category, memo, price]
        ];

        try {
            // これが「行追加」のための特別なURLです
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/Sheet1!A1:append?valueInputOption=USER_ENTERED`;

            const resp = await fetch(url, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${accessToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ values: values })
            });

            if (resp.ok) {
                document.getElementById('status-log').innerText = 'シートに保存成功！ 🌸';
                alert('スプレッドシートに追記しました！');
            } else {
                const errorData = await resp.json();
                console.error(errorData);
                document.getElementById('status-log').innerText = '保存失敗（IDや権限を確認してね）';
            }
        } catch (e) {
            document.getElementById('status-log').innerText = 'エラー発生 ⚠️';
        }
    }
</script>
</body>
</html>
