<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <title>🔁 逆引き価格計算シミュレーター</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* ════════════════════════════════
       CSS Variables
    ════════════════════════════════ */
    :root {
      --main:         #5b9ec9;
      --main-dark:    #3d7ba8;
      --sub-bg:       #e8f4fd;
      --sub:          #9ca3af;
      --accent-g:     #22c55e;
      --accent-o:     #f97316;
      --accent-r:     #ef4444;
      --text-main:    #1e293b;
      --text-muted:   #64748b;
      --bg-soft:      #f0f7fc;
      --card-bg:      #ffffff;
      --border:       #e2e8f0;
      --warn-bg:      #fefce8;
      --warn-border:  #fde047;
      --warn-text:    #854d0e;
    }

    /* ════════════════════════════════
       Reset & Base
    ════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Kosugi Maru', 'Arial Rounded MT Bold', sans-serif;
      background: var(--bg-soft);
      color: var(--text-main);
      min-height: 100vh;
    }

    /* Quicksand: 英数字・数値すべて */
    .num,
    input[type="number"],
    .result-price,
    .pv,
    .cmp-price-cell,
    .cmp-rate-cell,
    .cs-price,
    .cs-rate,
    .slider-ends,
    .rate-badge,
    .hist-main strong {
      font-family: 'Quicksand', 'Arial Rounded MT Bold', sans-serif;
    }

    /* ════════════════════════════════
       Layout Wrapper
    ════════════════════════════════ */
    .wrapper {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 16px 40px;
    }

    /* ════════════════════════════════
       BLOCK 1 — HEADER
    ════════════════════════════════ */
    .site-header {
      background: var(--card-bg);
      border-bottom: 2px solid var(--sub-bg);
      margin-bottom: 20px;
    }
    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 16px 10px;
    }
    .site-title {
      font-family: 'Quicksand', 'Kosugi Maru', sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--main);
      letter-spacing: 0.03em;
      margin-bottom: 4px;
    }
    .site-subtitle {
      font-size: 0.72rem;
      color: var(--sub);
    }

    /* Warning banner */
    .warn-banner {
      background: var(--warn-bg);
      border-top: 1px solid var(--warn-border);
      padding: 8px 16px;
      font-size: 0.72rem;
      color: var(--warn-text);
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .warn-banner-inner {
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    /* ════════════════════════════════
       Card Base
    ════════════════════════════════ */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 0.82rem;
      font-weight: bold;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ════════════════════════════════
       BLOCK 2 — MAIN GRID
    ════════════════════════════════ */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
      margin-bottom: 0;
    }
    @media (max-width: 650px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    /* ════════════════════════════════
       Form Elements
    ════════════════════════════════ */
    label.lbl {
      font-size: 0.78rem;
      font-weight: bold;
      color: var(--text-muted);
      display: block;
      margin-bottom: 5px;
    }
    select,
    input[type="number"],
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      background: white;
      outline: none;
      color: var(--text-main);
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    select {
      font-family: 'Kosugi Maru', 'Arial Rounded MT Bold', sans-serif;
      font-size: 0.88rem;
    }
    input[type="number"] {
      font-family: 'Quicksand', 'Arial Rounded MT Bold', sans-serif;
    }
    select:focus, input:focus { border-color: var(--main); }
    input:disabled { background: #f8fafc; color: #cbd5e1; }

    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    /* Priority checkboxes */
    .pri-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 14px;
    }
    .pri-check { display: none; }
    .pri-label {
      display: block;
      padding: 8px 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: white;
      text-align: center;
      font-size: 0.72rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: 0.2s;
      line-height: 1.4;
    }
    .pri-check:checked + .pri-label {
      background: var(--main);
      color: white;
      border-color: var(--main);
      font-weight: bold;
    }

    /* Profit slider */
    .profit-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 3px;
      outline: none;
      margin-bottom: 4px;
      padding: 0;
      border: none;
      cursor: pointer;
    }
    .profit-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--main);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(91,158,201,0.4);
    }
    .slider-ends {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: var(--sub);
      margin-bottom: 12px;
    }

    /* Mode tabs */
    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin: 4px 0 12px;
    }
    .mode-tab {
      padding: 9px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: white;
      font-size: 0.78rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: 0.2s;
      font-family: 'Kosugi Maru', sans-serif;
    }
    .mode-tab.active {
      background: var(--sub-bg);
      color: var(--main);
      border-color: var(--main);
      font-weight: bold;
    }

    /* Preset grid */
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }
    .preset-btn {
      padding: 9px 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: white;
      font-size: 0.75rem;
      cursor: pointer;
      color: var(--text-muted);
      text-align: center;
      transition: 0.2s;
      font-family: 'Kosugi Maru', sans-serif;
    }
    .preset-btn.active {
      background: var(--sub-bg);
      color: var(--main);
      border-color: var(--main);
      font-weight: bold;
    }
    .preset-summary {
      background: #f8fafc;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.72rem;
      color: var(--sub);
      text-align: center;
      font-family: 'Quicksand', 'Kosugi Maru', sans-serif;
    }

    @keyframes flashInput {
      0%, 100% { background: white; }
      50%       { background: var(--sub-bg); }
    }
    .flash { animation: flashInput 0.5s ease; }

    .reset-btn {
      font-size: 0.7rem;
      color: var(--sub);
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      padding: 3px 10px;
      font-family: 'Kosugi Maru', sans-serif;
    }

    /* ════════════════════════════════
       Result Box
    ════════════════════════════════ */
    .result-box {
      background: var(--sub-bg);
      padding: 20px 16px 16px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 14px;
    }
    .result-label { font-size: 0.75rem; color: var(--sub); margin-bottom: 4px; }
    .result-price {
      font-family: 'Quicksand', 'Arial Rounded MT Bold', sans-serif;
      font-size: 3rem;
      font-weight: 700;
      line-height: 1;
      color: var(--main);
      letter-spacing: -0.02em;
    }
    .result-note { font-size: 0.68rem; color: var(--sub); margin-top: 8px; }
    .rate-badge {
      display: inline-block;
      padding: 3px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: bold;
      margin-top: 6px;
    }
    .method-badge {
      display: block;
      background: var(--accent-g);
      color: white;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      margin-top: 8px;
    }

    .spec-card {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.75rem;
      color: #1d4ed8;
      margin-bottom: 10px;
      line-height: 1.6;
    }
    .if-card {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.75rem;
      color: #c2410c;
      margin-bottom: 10px;
    }
    .if-item {
      margin-top: 5px;
      padding-left: 10px;
      border-left: 2px solid var(--accent-o);
    }

    /* ════════════════════════════════
       Responsive: table vs card toggle
       PC (≥651px): desktop-only visible
       Mobile (≤650px): mobile-only visible
    ════════════════════════════════ */
    .desktop-only { display: block; }
    .mobile-only  { display: none;  }

    @media (max-width: 650px) {
      .desktop-only { display: none  !important; }
      .mobile-only  { display: block !important; }
      .cmp-cards-mobile.mobile-only { display: grid !important; }
    }

    /* ── Breakdown: PC table ── */
    .detail-tbl-wrap {
      border-top: 1px dashed var(--border);
      margin-top: 12px;
      padding-top: 4px;
    }
    .detail-tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    .detail-tbl td {
      padding: 5px 4px;
      vertical-align: middle;
    }
    .detail-tbl td:last-child {
      text-align: right;
      font-family: 'Quicksand', 'Arial Rounded MT Bold', sans-serif;
    }
    .detail-tbl .sub-row td {
      font-size: 0.7rem;
      color: var(--sub);
      padding-left: 16px;
    }
    .detail-tbl .profit-row td {
      font-weight: bold;
      color: var(--main);
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .formula {
      font-size: 0.62rem;
      color: var(--sub);
      display: block;
    }

    /* ── Breakdown: mobile cards ── */
    .detail-cards {
      margin-top: 12px;
      border-top: 1px dashed var(--border);
      padding-top: 10px;
    }
    .detail-card-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 4px 0;
      font-size: 0.8rem;
    }
    .detail-card-sub {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--sub);
      padding: 2px 0 2px 12px;
    }
    .detail-card-profit {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      color: var(--main);
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
      padding: 8px 0 4px;
      margin-top: 4px;
    }

    /* Action buttons */
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-copy {
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 11px 6px;
      border-radius: 10px;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      font-family: 'Kosugi Maru', sans-serif;
    }
    .btn-save {
      background: var(--sub-bg);
      border: 1px solid var(--main);
      padding: 11px 6px;
      border-radius: 10px;
      font-size: 0.8rem;
      color: var(--main);
      cursor: pointer;
      font-weight: bold;
      font-family: 'Kosugi Maru', sans-serif;
    }

    /* ════════════════════════════════
       BLOCK 3 — SUMMARY BAR
    ════════════════════════════════ */
    .summary-section { margin-bottom: 16px; }
    .cmp-hint { font-size: 0.67rem; color: var(--sub); margin-bottom: 10px; }

    /* PC: comparison table */
    .cmp-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .cmp-table th {
      background: #f8fafc;
      padding: 8px 10px;
      text-align: left;
      font-size: 0.72rem;
      color: var(--sub);
      border-bottom: 2px solid var(--border);
      font-family: 'Kosugi Maru', sans-serif;
    }
    .cmp-table td {
      padding: 10px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .cmp-table tr.is-best  td { background: var(--sub-bg); }
    .cmp-table tr.is-current td { background: #f0fdf4; }
    .cmp-table tr { cursor: pointer; transition: background 0.15s; }
    .cmp-table tr:hover td { background: #f8fafc; }
    .cmp-site-name { font-weight: bold; color: var(--text-main); }
    .cmp-price-cell {
      font-size: 1.05rem;
      font-weight: 700;
    }
    .cmp-rate-cell {
      font-size: 0.82rem;
      font-weight: bold;
    }
    .cmp-method-cell { font-size: 0.7rem; color: var(--sub); }
    .cmp-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.62rem;
      font-weight: bold;
    }
    .cmp-badge.best    { background: var(--main); color: white; }
    .cmp-badge.current { background: #94a3b8;     color: white; }

    /* Mobile: comparison cards */
    .cmp-cards-mobile {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .cmp-cell {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .cmp-cell.is-best    { border-color: var(--main); background: var(--sub-bg); }
    .cmp-cell.is-current { box-shadow: 0 0 0 2px var(--main); }
    .cs-name   { font-size: 0.68rem; font-weight: bold; color: var(--text-muted); margin-bottom: 3px; }
    .cs-price  { font-size: 1.05rem; font-weight: 700; line-height: 1.1; }
    .cs-rate   { font-size: 0.7rem;  font-weight: bold; margin: 2px 0; }
    .cs-method { font-size: 0.6rem;  color: var(--sub); margin-top: 3px; }
    .cs-badge  {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 8px;
      font-size: 0.58rem;
      margin-top: 3px;
    }
    .cs-badge.best { background: var(--main); color: white; }
    .cs-badge.curr { background: #94a3b8;     color: white; }

    /* ════════════════════════════════
       History
    ════════════════════════════════ */
    .hist-item {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 6px;
      cursor: pointer;
      transition: 0.15s;
    }
    .hist-item:hover { background: #f8fafc; }
    .hist-meta   { font-size: 0.68rem; color: var(--sub); margin-bottom: 2px; }
    .hist-main   { font-size: 0.85rem; }
    .hist-method { font-size: 0.68rem; color: var(--sub); margin-top: 2px; }
    .hist-hint   { font-size: 0.65rem; color: var(--sub); margin-bottom: 8px; }
    .clear-btn {
      font-size: 0.7rem;
      color: #ef4444;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      cursor: pointer;
      padding: 4px 10px;
      font-family: 'Kosugi Maru', sans-serif;
    }

    /* localStorage note */
    .storage-note {
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.7rem;
      color: var(--warn-text);
      line-height: 1.6;
      margin-bottom: 16px;
    }

    /* ════════════════════════════════
       BLOCK 4 — FOOTER
    ════════════════════════════════ */
    .site-footer {
      text-align: center;
      padding: 24px 16px 20px;
      font-size: 10px;
      color: var(--sub);
      opacity: 0.7;
      letter-spacing: 0.1em;
      font-family: 'Quicksand', 'Kosugi Maru', sans-serif;
    }
    .site-footer::before {
      content: '';
      display: block;
      width: 40px;
      height: 1px;
      background: var(--sub);
      opacity: 0.5;
      margin: 0 auto 10px;
    }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════
     BLOCK 1: HEADER
════════════════════════════════════════ -->
<header class="site-header">
  <div class="header-inner">
    <h1 class="site-title">🔁 逆引き価格計算シミュレーター</h1>
    <p class="site-subtitle">希望する純利益から、フリマサイトの最低出品価格を自動計算します</p>
  </div>
  <div class="warn-banner">
    <div class="warn-banner-inner">
      ⚠️ 計算結果は目安です。手数料・送料は各サービスの最新情報をご確認ください。実際の取引における損失について、当サイトは責任を負いません。
    </div>
  </div>
</header>

<!-- BLOCK 2 + 3 (React mount) -->
<div id="root"></div>

<!-- ════════════════════════════════════════
     BLOCK 4: FOOTER
════════════════════════════════════════ -->
<footer class="site-footer">
  © 2026 enu(エヌ) All rights reserved.
</footer>

<script type="text/babel">
const { useState, useEffect } = React;

/* ══════════════════════════════════════
   プリセット
══════════════════════════════════════ */
const PRESETS = [
  { label:'📇 トレカ',        h:'9',    w:'6.3',  t:'0.3', wg:'10'  },
  { label:'📚 文庫本',        h:'15',   w:'10.5', t:'1.5', wg:'200' },
  { label:'📖 単行本',        h:'19',   w:'13',   t:'2',   wg:'300' },
  { label:'👕 Tシャツ',       h:'30',   w:'25',   t:'2',   wg:'250' },
  { label:'👟 スニーカー',    h:'32',   w:'20',   t:'12',  wg:'800' },
  { label:'💿 CD/DVD',        h:'14.2', w:'12.5', t:'1',   wg:'100' },
  { label:'💄 コスメ（小）',  h:'15',   w:'10',   t:'3',   wg:'150' },
  { label:'📱 スマホケース',  h:'16',   w:'8',    t:'1',   wg:'50'  },
  { label:'💍 アクセサリ',    h:'10',   w:'8',    t:'2',   wg:'50'  },
  { label:'🎮 ゲームソフト',  h:'19',   w:'13.5', t:'1.5', wg:'100' },
];

const SITES    = ['メルカリ','メルカリショップス','ラクマ','BASE','Yahoo!フリマ'];
const DEF_FEE  = {
  'メルカリ':'10','メルカリショップス':'10',
  'ラクマ':'10','BASE':'6.6','Yahoo!フリマ':'5'
};
const CMP_SITES = ['メルカリ','ラクマ','BASE','Yahoo!フリマ'];

/* ══════════════════════════════════════
   配送マスタ
══════════════════════════════════════ */
function getMethods(dh, dw, dt, wg) {
  const ds = dh + dw + dt;
  const RU = 'https://fril.jp/ts/kantanrakumapack/';
  const MY = 'https://jp-news.mercari.com/more/yuyu-mercari';
  const MR = 'https://jp-news.mercari.com/more/rakuraku-mercari';

  const teikei = wg<=50?140: wg<=100?180: wg<=150?270: wg<=250?320: wg<=500?510: wg<=1000?750: null;

  return [
    // 共通
    { name:'定形外・規格内', shipping:teikei, material:0, cost:teikei, anon:false, trace:false, conv:false,
      info:'❌匿名不可 / ❌追跡なし / 重量で変動 / A4・3cm',

function getBestShipping(tSite, dh, dw, dt, wg, pris) {
  const all  = getMethods(dh, dw, dt, wg);
  let avail  = all.filter(m => m.size && (!m.platform || m.platform.includes(tSite)));
  if (pris.includes('anon'))  avail = avail.filter(m => m.anon);
  if (pris.includes('trace')) avail = avail.filter(m => m.trace);
  if (pris.includes('conv'))  avail = avail.filter(m => m.conv);
  avail.sort((a,b) => a.cost - b.cost);
  return avail.length > 0 ? avail[0]
    : all.find(m => (m.name.includes('60') || m.name.includes('宅急便'))
               && (!m.platform || m.platform.includes(tSite)));
}

/* ══════════════════════════════════════
   逆算計算
══════════════════════════════════════ */
function calcReverse(tSite, tFee, desiredProfit, dh, dw, dt, wg, ic, pc, pris) {
  const sel       = getBestShipping(tSite, dh, dw, dt, wg, pris);
  const shipping  = sel ? sel.cost : 0;
  const totalCost = shipping + ic + pc;
  const profit    = parseFloat(desiredProfit) || 0;
  let price, feeAmount, feeFormula;
  if (tSite === 'BASE') {
    if (tFee === '2.9') {
      price      = Math.ceil((profit + totalCost) / (1 - 0.029));
      feeAmount  = Math.ceil(price * 0.029);
      feeFormula = '販売価格 × 2.9%（グロース）';
    } else {
      price      = Math.ceil((profit + 40 + totalCost) / (1 - 0.066));
      feeAmount  = Math.ceil(price * 0.066 + 40);
      feeFormula = '販売価格 × 6.6% + 40円';
    }
  } else {
    const rate  = Number(tFee) / 100;
    price       = Math.ceil((profit + totalCost) / (1 - rate));
    feeAmount   = Math.ceil(price * rate);
    feeFormula  = `販売価格 × ${tFee}%`;
  }
  const actualProfit = price - feeAmount - totalCost;
  const profitRate   = price > 0 ? Math.round((actualProfit / price) * 100) : 0;
  return { price, feeAmount, feeFormula, actualProfit, profitRate, sel };
}

function shortName(n) {
  return n.replace(/^(メルカリ便|ラクマパック|Yahoo!フリマ|BASE)/,'')
           .replace(/[()（）]/g,'').trim() || n;
}

const LS_INPUTS = 'rpc_inputs_v3';
const LS_HIST   = 'rpc_history_v3';

function loadInputs() {
  try { const v = localStorage.getItem(LS_INPUTS); return v ? JSON.parse(v) : null; } catch { return null; }
}
function saveInputsLS(obj) {
  try { localStorage.setItem(LS_INPUTS, JSON.stringify(obj)); } catch {}
}
function loadHist() {
  try { const v = localStorage.getItem(LS_HIST); return v ? JSON.parse(v) : []; } catch { return []; }
}
function saveHistLS(arr) {
  try { localStorage.setItem(LS_HIST, JSON.stringify(arr)); } catch {}
}

          )}
        </div>

        {/* ── 右列: 結果カード ── */}
        <div className="card">
          <div className="card-title"><span>📊 計算結果</span></div>

          <div className="result-box">
            <div className="result-label">最低販売価格</div>
            <div className="result-price">¥{res.price.toLocaleString()}</div>
            <span className="rate-badge" style={{ background: rateBg(res.profitRate), color: rateColor(res.profitRate) }}>
              利益率 {res.profitRate}%
            </span>
            {res.sel && <div className="method-badge">{res.sel.name}</div>}
            <div className="result-note">この価格以上で出品すれば希望利益が確保できます</div>
          </div>

          {res.sel && (
            <div className="spec-card">
              <strong>📦 自動選択された配送方法</strong><br />
              {res.sel.info}
              {res.sel.material > 0 && ` ／ 配送資材(${res.sel.materialNote}) ¥${res.sel.material}が別途必要`}
            </div>
          )}

          {hints.length > 0 && (
            <div className="if-card">
              <strong>💡 価格を下げるヒント</strong>
              {hints.map((t, i) => <div key={i} className="if-item">{t}</div>)}
            </div>
          )}

          {/* PC: 内訳テーブル（desktop-only） */}
          <div className="detail-tbl-wrap desktop-only">
          <table className="detail-tbl">
            <tbody>
              <tr>
                <td style={{ color:'var(--accent-g)', fontWeight:'bold' }}>最低販売価格</td>
                <td style={{ color:'var(--accent-g)', fontWeight:'bold' }}>¥{res.price.toLocaleString()}</td>
              </tr>
              <tr>
                <td style={{ color:'var(--accent-r)' }}>
                  販売手数料<span className="formula">{res.feeFormula}</span>
                </td>
                <td style={{ color:'var(--accent-r)' }}>-¥{res.feeAmount.toLocaleString()}</td>
              </tr>
              {res.sel && <>
                <tr>
                  <td style={{ color:'var(--accent-r)' }}>送料</td>
                  <td style={{ color:'var(--accent-r)' }}>-¥{res.sel.shipping.toLocaleString()}</td>
                </tr>
                {res.sel.material > 0 && (
                  <tr className="sub-row">
                    <td>└ 配送資材（{res.sel.materialNote}）</td>
                    <td>-¥{res.sel.material}</td>
                  </tr>
                )}
              </>}
              {ic > 0 && <tr><td style={{ color:'var(--text-muted)' }}>原価</td><td style={{ color:'var(--text-muted)' }}>-¥{ic.toLocaleString()}</td></tr>}
              {pc > 0 && <tr><td style={{ color:'var(--text-muted)' }}>梱包資材費</td><td style={{ color:'var(--text-muted)' }}>-¥{pc.toLocaleString()}</td></tr>}
              <tr className="profit-row"><td>純利益</td><td>¥{res.actualProfit.toLocaleString()}</td></tr>
            </tbody>
          </table>
          </div>

          {/* Mobile: 内訳カード（mobile-only） */}
          <div className="detail-cards mobile-only">
            <div className="detail-card-row">
              <span style={{ color:'var(--accent-g)', fontWeight:'bold' }}>最低販売価格</span>
              <span className="pv" style={{ color:'var(--accent-g)', fontWeight:'bold' }}>¥{res.price.toLocaleString()}</span>
            </div>
            <div className="detail-card-row">
              <span style={{ color:'var(--accent-r)' }}>
                販売手数料<span className="formula">{res.feeFormula}</span>
              </span>
              <span className="pv" style={{ color:'var(--accent-r)' }}>-¥{res.feeAmount.toLocaleString()}</span>
            </div>
            {res.sel && <>
              <div className="detail-card-row">
                <span style={{ color:'var(--accent-r)' }}>送料</span>
                <span className="pv" style={{ color:'var(--accent-r)' }}>-¥{res.sel.shipping.toLocaleString()}</span>
              </div>
              {res.sel.material > 0 && (
                <div className="detail-card-sub">
                  <span>└ 配送資材（{res.sel.materialNote}）</span>
                  <span>-¥{res.sel.material}</span>
                </div>
              )}
            </>}
            {ic > 0 && (
              <div className="detail-card-row">
                <span style={{ color:'var(--text-muted)' }}>原価</span>
                <span className="pv" style={{ color:'var(--text-muted)' }}>-¥{ic.toLocaleString()}</span>
              </div>
            )}
            {pc > 0 && (
              <div className="detail-card-row">
                <span style={{ color:'var(--text-muted)' }}>梱包資材費</span>
                <span className="pv" style={{ color:'var(--text-muted)' }}>-¥{pc.toLocaleString()}</span>
              </div>
            )}
            <div className="detail-card-profit">
              <span>純利益</span>
              <span className="pv">¥{res.actualProfit.toLocaleString()}</span>
            </div>
          </div>

          <div className="btn-row">
            <button className="btn-copy" onClick={onCopy}>📋 結果をコピー</button>
            <button className="btn-save" onClick={saveHist}>🕐 履歴に保存</button>
          </div>
        </div>
      </div>{/* /main-grid */}

      {/* ════════════════════════════════
          BLOCK 3: SUMMARY BAR
          全サイト比較
      ════════════════════════════════ */}
      <div className="card summary-section">
        <div className="card-title">🏆 全サイト比較（必要販売価格）</div>
        <p className="cmp-hint">
          価格が低いほど出品しやすい。行 / カードをタップで選択サイトを切り替え。
        </p>

        {/* PC: 比較テーブル（desktop-only） */}
        <table className="cmp-table desktop-only">
          <thead>
            <tr>
              <th>サイト</th>
              <th>販売価格</th>
              <th>利益率</th>
              <th>配送方法</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {cmp.map(({ site: s, r }) => {
              const isBest    = bestSite && bestSite.site === s;
              const isCurrent = s === site || (s === 'メルカリ' && site === 'メルカリショップス');
              return (
                <tr key={s}
                  className={`${isBest ? 'is-best' : ''} ${isCurrent ? 'is-current' : ''}`}
                  onClick={() => { setSite(s); setFeeRate(DEF_FEE[s]); }}>
                  <td className="cmp-site-name">{s}</td>
                  <td className="cmp-price-cell" style={{ color: isBest ? 'var(--main)' : 'var(--text-muted)' }}>
                    ¥{r.price.toLocaleString()}
                  </td>
                  <td className="cmp-rate-cell" style={{ color: rateColor(r.profitRate) }}>
                    {r.profitRate}%
                  </td>
                  <td className="cmp-method-cell">{r.sel ? shortName(r.sel.name) : '—'}</td>
                  <td>
                    {isBest    && <span className="cmp-badge best">最安出品価格</span>}
                    {isCurrent && !isBest && <span className="cmp-badge current">選択中</span>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>

        {/* Mobile: 比較カード（mobile-only） */}
        <div className="cmp-cards-mobile mobile-only">
          {cmp.map(({ site: s, r }) => {
            const isBest    = bestSite && bestSite.site === s;
            const isCurrent = s === site || (s === 'メルカリ' && site === 'メルカリショップス');
            return (
              <div key={s}
                className={`cmp-cell ${isBest ? 'is-best' : ''} ${isCurrent ? 'is-current' : ''}`}
                onClick={() => { setSite(s); setFeeRate(DEF_FEE[s]); }}>
                <div className="cs-name">{s}</div>
                <div className="cs-price" style={{ color: isBest ? 'var(--main)' : 'var(--text-muted)' }}>
                  ¥{r.price.toLocaleString()}
                </div>
                <div className="cs-rate" style={{ color: rateColor(r.profitRate) }}>
                  利益率 {r.profitRate}%
                </div>
                <div className="cs-method">{r.sel ? shortName(r.sel.name) : '—'}</div>
                {isBest    && <span className="cs-badge best">最安出品価格</span>}
                {isCurrent && !isBest && <span className="cs-badge curr">選択中</span>}
              </div>
            );
          })}
        </div>
      </div>

      {/* 計算履歴 */}
      {hist.length > 0 && (
        <div className="card">
          <div className="card-title">
            <span>🕐 計算履歴（直近{hist.length}件）</span>
            <button className="clear-btn"
              onClick={() => { if (window.confirm('履歴を削除しますか？')) setHist([]); }}>
              🗑 削除
            </button>
          </div>
          <div className="hist-hint">タップすると入力値を復元できます</div>
          {hist.map(e => (
            <div key={e.id} className="hist-item" onClick={() => restoreHist(e)}>
              <div className="hist-meta">{e.date} · {e.site}</div>
              <div className="hist-main">
                希望 ¥{Number(e.desiredProfit).toLocaleString()} →{' '}
                <strong style={{ color:'var(--main)' }}>
                  出品 ¥{Number(e.price).toLocaleString()}
                </strong>
                <span style={{ fontSize:'0.72rem', color:'var(--sub)', marginLeft:'5px' }}>
                  ({e.profitRate}%)
                </span>
              </div>
              <div className="hist-method">{e.methodName}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
