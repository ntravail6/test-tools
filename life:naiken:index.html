<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>内見ノート</title>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════
   CSS VARIABLES
══════════════════════════════ */
:root {
  --gr:     #4E7D63;
  --gr-d:   #3A5F4A;
  --gr-l:   #EBF4EE;
  --am:     #D4813A;
  --am-l:   #FDF0E4;
  --bg:     #F5F1EC;
  --card:   #FFFFFF;
  --text:   #2A2724;
  --sub:    #8A7F78;
  --muted:  #B0A89F;
  --bdr:    #E2DAD2;
  --red:    #C0392B;
  --warn-bg:#FFFBEB;
  --warn-bd:#F59E0B;
  --warn-tx:#92400E;
  --star:   #F5A623;
  --font:   'Quicksand', 'Kosugi Maru', 'Arial Rounded MT Bold', sans-serif;
  --radius: 12px;
  --shadow: 0 2px 10px rgba(0,0,0,.07);
}

/* ══════════════════════════════
   RESET & BASE
══════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* ══════════════════════════════
   LAYOUT WRAPPER
══════════════════════════════ */
.wrap{max-width:960px;margin:0 auto;padding:0 16px}

/* ══════════════════════════════
   ① HEADER
══════════════════════════════ */
.hdr{
  position:sticky;top:0;z-index:100;
  background:var(--card);
  border-bottom:1px solid var(--bdr);
  box-shadow:0 1px 6px rgba(0,0,0,.06);
}
.hdr-inner{
  max-width:960px;margin:0 auto;
  padding:10px 16px 0;
}
.hdr-top{
  display:flex;align-items:center;
  justify-content:space-between;
  margin-bottom:9px;
}
.logo{
  font-family:var(--font);
  font-size:1.15rem;font-weight:700;
  color:var(--gr);letter-spacing:.03em;
  display:flex;align-items:center;gap:6px;
}
.logo em{color:var(--am);font-style:normal}
.hdr-acts{display:flex;gap:6px}
.iBtn{
  width:34px;height:34px;
  border:1px solid var(--bdr);border-radius:9px;
  background:var(--bg);color:var(--sub);
  cursor:pointer;font-size:.9rem;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,border-color .12s;
}
.iBtn:hover{background:var(--gr-l);border-color:var(--gr)}

/* TABS */
.tabs{
  display:flex;gap:5px;
  overflow-x:auto;scrollbar-width:none;
  padding:2px 0 0;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;
  padding:7px 14px 9px;
  border:none;border-bottom:3px solid transparent;
  background:transparent;
  cursor:pointer;
  font-family:var(--font);font-size:.76rem;font-weight:700;
  color:var(--sub);white-space:nowrap;
  transition:color .15s,border-color .15s;
}
.tab.on{color:var(--gr);border-bottom-color:var(--gr)}
.addTab{
  flex:0 0 auto;
  margin-bottom:3px;
  align-self:center;
  width:26px;height:26px;
  border:1.5px dashed var(--bdr);background:transparent;
  border-radius:50%;cursor:pointer;
  font-size:1rem;color:var(--sub);
  display:flex;align-items:center;justify-content:center;
  transition:border-color .12s,color .12s;
}
.addTab:hover{border-color:var(--gr);color:var(--gr)}

/* ══════════════════════════════
   ⚠️ NOTICE (警告)
══════════════════════════════ */
.notice-bar{
  background:var(--warn-bg);
  border-bottom:1px solid var(--warn-bd);
  padding:9px 16px;
  font-size:.72rem;
  color:var(--warn-tx);
  line-height:1.5;
  text-align:center;
  font-weight:600;
}
.notice-bar span{opacity:.8;font-weight:500}

/* ══════════════════════════════
   ② MAIN
══════════════════════════════ */
.main{
  max-width:960px;margin:0 auto;
  padding:18px 16px 160px;
}

/* PROP HEADER CARD */
.propHdr{
  background:var(--card);
  border:1px solid var(--bdr);
  border-radius:var(--radius);
  padding:14px 16px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.propTop{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.nameIn{
  flex:1;
  border:none;border-bottom:2px solid var(--bdr);
  font-family:var(--font);font-size:1rem;font-weight:700;
  color:var(--text);background:transparent;
  outline:none;padding:5px 3px;
  transition:border-color .15s;
}
.nameIn:focus{border-bottom-color:var(--gr)}
.nameIn::placeholder{color:var(--muted);font-weight:500}

/* PHOTOS */
.photoGrid{display:flex;flex-wrap:wrap;gap:8px}
.photoWrap{position:relative;display:inline-flex}
.photoThumb{
  width:72px;height:72px;
  border-radius:9px;object-fit:cover;
  border:1px solid var(--bdr);display:block;
}
.photoDel{
  position:absolute;top:-6px;right:-6px;
  width:20px;height:20px;border-radius:50%;
  background:var(--red);color:#fff;border:none;
  font-size:.6rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.2);
}
.photoAdd{
  width:72px;height:72px;border-radius:9px;
  border:1.5px dashed var(--bdr);background:var(--bg);
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;cursor:pointer;
  font-size:1.4rem;color:var(--muted);gap:3px;
  transition:border-color .12s,color .12s;
}
.photoAdd:hover{border-color:var(--gr);color:var(--gr)}
.photoAdd span{font-size:.58rem;color:var(--sub)}

/* ── SECTION LABEL (shared) ── */
.secLabel{
  font-size:.65rem;font-weight:700;
  color:var(--sub);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:5px;display:block;
}

/* ══════════════════════════════
   PC TABLE VIEW (>650px)
══════════════════════════════ */
.pc-view{display:block}
.mb-view{display:none}

.pc-section{
  background:var(--card);
  border:1px solid var(--bdr);
  border-radius:var(--radius);
  margin-bottom:12px;
  overflow:hidden;
  box-shadow:var(--shadow);
}
.pc-sec-hdr{
  padding:12px 16px;
  background:var(--bg);
  border-bottom:1px solid var(--bdr);
  font-weight:700;font-size:.88rem;
  display:flex;align-items:center;gap:7px;
}
.pc-table{
  width:100%;border-collapse:collapse;
}
.pc-table tr{border-bottom:1px solid var(--bdr)}
.pc-table tr:last-child{border-bottom:none}
.pc-table td{padding:10px 14px;vertical-align:middle}
.pc-table td.lbl-col{
  width:160px;font-size:.72rem;font-weight:700;
  color:var(--sub);text-transform:uppercase;
  letter-spacing:.04em;background:var(--bg);
  border-right:1px solid var(--bdr);
}
.pc-table td.inp-col{background:#fff}

/* ══════════════════════════════
   MOBILE CARD VIEW (≤650px)
══════════════════════════════ */
@media (max-width:650px){
  .pc-view{display:none}
  .mb-view{display:block}
}

/* Accordion */
.sec{
  margin-bottom:9px;
  border-radius:var(--radius);
  border:1px solid var(--bdr);
  background:var(--card);
  overflow:hidden;
  box-shadow:var(--shadow);
}
.secHdr{
  padding:13px 16px;font-weight:700;font-size:.88rem;
  cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
  user-select:none;
}
.secHdr .arr{color:var(--gr);font-size:.7rem;transition:transform .2s}
.sec.open .arr{transform:rotate(180deg)}
.secBody{display:none;padding:4px 14px 14px}
.sec.open .secBody{display:block}

/* ══════════════════════════════
   FORM INPUTS (shared)
══════════════════════════════ */
.iRow{margin-bottom:11px}
.iLbl{
  display:block;font-size:.68rem;font-weight:700;
  color:var(--sub);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.04em;
}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  font-size:.77rem;padding:5px 12px;
  border-radius:20px;background:var(--bg);
  color:var(--sub);cursor:pointer;
  border:1px solid var(--bdr);
  font-family:var(--font);font-weight:700;
  transition:all .12s;
}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--gr);color:#fff;border-color:var(--gr)}

/* PC chips inline */
.chips-inline{display:flex;flex-wrap:wrap;gap:5px}

input.iIn,textarea.iIn{
  width:100%;padding:8px 11px;
  border:1px solid var(--bdr);border-radius:8px;
  font-family:var(--font);font-size:.84rem;
  background:var(--bg);color:var(--text);outline:none;
  transition:border-color .15s,background .15s;
}
input.iIn:focus,textarea.iIn:focus{
  border-color:var(--gr);background:#fff;
}
textarea.iIn{resize:none;height:60px}

/* STARS */
.stars{display:flex;gap:5px;align-items:center}
.star{
  font-size:1.6rem;cursor:pointer;
  transition:transform .1s;line-height:1;
  color:#ddd;user-select:none;
}
.star:active{transform:scale(.85)}
.star.on{color:var(--star)}
.starVal{
  font-size:.72rem;color:var(--sub);
  margin-left:6px;font-weight:700;
}

/* CUSTOM FIELDS */
.cfRow{display:flex;gap:7px;align-items:center;margin-bottom:8px}
.cfLbl{
  flex:0 0 110px;font-size:.73rem;
  font-family:var(--font);padding:8px 9px;
  border:1px solid var(--bdr);border-radius:8px;
  background:var(--bg);color:var(--text);
  outline:none;font-weight:700;
}
.cfLbl:focus{border-color:var(--am);background:#fff}
.cfDel{
  background:none;border:none;color:var(--red);
  cursor:pointer;font-size:1.1rem;padding:4px;flex-shrink:0;
}
.cfAdd{
  width:100%;padding:9px;
  border:1.5px dashed var(--bdr);background:transparent;
  border-radius:8px;color:var(--sub);
  font-family:var(--font);font-size:.8rem;cursor:pointer;
  margin-top:2px;font-weight:700;
  transition:border-color .12s,color .12s;
}
.cfAdd:hover{border-color:var(--am);color:var(--am)}

/* DELETE BUTTON */
.btnDanger{
  background:none;border:none;color:var(--red);
  font-size:.73rem;cursor:pointer;
  font-family:var(--font);display:block;
  margin:14px auto 4px;padding:6px;font-weight:700;
}

/* ══════════════════════════════
   ③ SUMMARY BAR (fixed bottom)
══════════════════════════════ */
.bBar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--card);
  border-top:1px solid var(--bdr);
  box-shadow:0 -2px 12px rgba(0,0,0,.08);
  z-index:100;
}
.bBar-inner{
  max-width:960px;margin:0 auto;
  padding:10px 16px;
  display:flex;align-items:center;gap:10px;
}
.summaryStats{
  display:flex;gap:14px;flex:1;align-items:center;
  overflow:hidden;
}
.statItem{
  display:flex;flex-direction:column;
  align-items:center;
  min-width:52px;
}
.statVal{
  font-family:var(--font);font-size:.98rem;font-weight:700;
  color:var(--gr);line-height:1.1;
}
.statLbl{
  font-size:.6rem;color:var(--sub);font-weight:600;
  white-space:nowrap;
}
.statDiv{width:1px;height:28px;background:var(--bdr)}
.bBar-btns{display:flex;gap:7px;flex-shrink:0}
.btnPri{
  padding:10px 16px;
  background:var(--gr);color:#fff;border:none;
  border-radius:9px;font-family:var(--font);
  font-weight:700;font-size:.82rem;cursor:pointer;
  white-space:nowrap;
  transition:background .12s;
}
.btnPri:hover{background:var(--gr-d)}
.btnSec{
  padding:10px 14px;
  background:var(--bg);color:var(--text);
  border:1px solid var(--bdr);border-radius:9px;
  font-family:var(--font);font-weight:700;
  font-size:.8rem;cursor:pointer;white-space:nowrap;
  transition:background .12s;
}
.btnSec:hover{background:var(--gr-l);border-color:var(--gr)}

/* Progress bar */
.progressWrap{
  flex:1;min-width:60px;max-width:120px;
  display:flex;flex-direction:column;gap:3px;
}
.progressBar{
  height:5px;background:var(--bdr);border-radius:3px;overflow:hidden;
}
.progressFill{
  height:100%;background:var(--gr);border-radius:3px;
  transition:width .4s ease;
}

@media (max-width:500px){
  .summaryStats{gap:8px}
  .statItem{min-width:40px}
  .statVal{font-size:.85rem}
  .btnPri{padding:9px 12px;font-size:.76rem}
  .btnSec{padding:9px 10px;font-size:.74rem}
  .progressWrap{display:none}
}

/* ══════════════════════════════
   MODALS
══════════════════════════════ */
.modal{
  display:none;position:fixed;inset:0;
  background:var(--card);z-index:1000;overflow-y:auto;
}
.modalHdr{
  position:sticky;top:0;background:var(--card);
  padding:13px 18px;border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 1px 6px rgba(0,0,0,.05);
}
.modalHdr strong{font-size:.9rem}
.closeBtn{
  border:none;background:var(--bg);
  padding:6px 14px;border-radius:20px;
  cursor:pointer;font-weight:700;
  font-family:var(--font);font-size:.82rem;
  color:var(--text);
}

/* Compare table */
.cmpWrap{overflow-x:auto;padding:16px}
.cmpTbl{border-collapse:collapse;min-width:500px;font-size:.74rem;width:100%}
.cmpTbl th,.cmpTbl td{border:1px solid var(--bdr);padding:9px 10px;text-align:center;min-width:100px}
.cmpTbl th{background:var(--bg);font-weight:700}
.cmpTbl .lc{
  text-align:left;position:sticky;left:0;
  background:#fff;font-weight:700;
  color:var(--sub);min-width:100px;font-size:.7rem;
  z-index:2;
}
.cmpTbl th.lc{background:var(--bg)}
.cmpPhoto{width:82px;height:58px;object-fit:cover;border-radius:5px}

/* ══════════════════════════════
   SHARE SHEET
══════════════════════════════ */
.overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.45);z-index:1100;
  align-items:flex-end;justify-content:center;
}
.overlay.vis{display:flex}
.sheet{
  background:#fff;border-radius:20px 20px 0 0;
  padding:24px 20px;width:100%;max-width:960px;
}
.sheetTitle{
  font-weight:700;font-size:.98rem;
  text-align:center;margin-bottom:16px;color:var(--text);
}
.sheetBtns{display:flex;flex-direction:column;gap:9px}
.sheetBtn{
  padding:13px 16px;border:1px solid var(--bdr);
  border-radius:11px;background:var(--bg);
  font-family:var(--font);font-size:.87rem;
  cursor:pointer;text-align:left;
  color:var(--text);font-weight:700;
  transition:background .12s;
}
.sheetBtn:active,.sheetBtn:hover{background:var(--gr-l)}
.sheetCancel{
  margin-top:14px;width:100%;padding:11px;
  border:1px solid var(--bdr);border-radius:10px;
  background:#fff;cursor:pointer;
  font-family:var(--font);font-size:.87rem;font-weight:700;
}

/* ══════════════════════════════
   NAV LINK
══════════════════════════════ */
.appLink{text-align:center;margin-top:20px}
.appLink a{
  font-size:.75rem;color:var(--gr);
  text-decoration:none;padding:7px 18px;
  border:1px solid var(--gr);border-radius:20px;
  font-weight:700;transition:background .12s;
}
.appLink a:hover{background:var(--gr-l)}

/* ══════════════════════════════
   ④ FOOTER
══════════════════════════════ */
.footer{
  text-align:center;
  font-size:.65rem;
  color:var(--sub);
  padding:22px 0 10px;
  opacity:.7;
  letter-spacing:.06em;
}

/* ══════════════════════════════
   PRINT
══════════════════════════════ */
@media print{
  .hdr-acts,.addTab,.bBar,.overlay,.appLink,
  .cfAdd,.cfDel,.btnDanger,.photoAdd,.photoDel,
  .notice-bar{display:none!important}
  .modal{display:none!important}
  .sec{break-inside:avoid}
  .secBody{display:block!important}
  .mb-view{display:block!important}
  .pc-view{display:none!important}
  .tab.on::after{content:' ✓'}
}
</style>
</head>
<body>

<!-- ① HEADER -->
<div class="hdr">
  <div class="hdr-inner">
    <div class="hdr-top">
      <div class="logo">🏠 内見<em>ノート</em></div>
      <div class="hdr-acts">
        <button class="iBtn" onclick="openShare()" title="共有・バックアップ">📤</button>
        <button class="iBtn" onclick="window.print()" title="PDF保存">🖨️</button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
</div>

<!-- ⚠️ NOTICE -->
<div class="notice-bar">
  ⚠️ <strong>免責事項：</strong><span>本アプリの情報はあくまで個人的な内見メモです。物件の正確な情報は必ず不動産会社にご確認ください。</span>
</div>

<!-- ② MAIN -->
<div class="main">

  <!-- 物件ヘッダー -->
  <div class="propHdr">
    <div class="propTop">
      <input class="nameIn" id="nameIn" type="text"
        placeholder="物件名（例: パークホーム渋谷 201）"
        oninput="updateName(this.value)">
    </div>
    <div class="photoGrid" id="photoGrid"></div>
  </div>

  <!-- PC TABLE VIEW -->
  <div class="pc-view" id="pcView"></div>

  <!-- MOBILE CARD VIEW -->
  <div class="mb-view" id="mbView"></div>

  <button class="btnDanger" onclick="deleteProp()">🗑 この物件データを削除</button>

  <div class="appLink"><a href="move.html">📦 引越しチェックリストへ →</a></div>

  <div class="footer">© 2026 enu(エヌ) All rights reserved.</div>
</div>

<!-- ③ SUMMARY BAR -->
<div class="bBar">
  <div class="bBar-inner">
    <div class="summaryStats" id="summaryStats">
      <div class="statItem">
        <span class="statVal" id="sumStar">—</span>
        <span class="statLbl">総合評価</span>
      </div>
      <div class="statDiv"></div>
      <div class="statItem">
        <span class="statVal" id="sumAvg">—</span>
        <span class="statLbl">平均評価</span>
      </div>
      <div class="statDiv"></div>
      <div class="progressWrap">
        <span class="statLbl" id="sumPctLbl">記入率 0%</span>
        <div class="progressBar">
          <div class="progressFill" id="sumProgress" style="width:0%"></div>
        </div>
      </div>
    </div>
    <div class="bBar-btns">
      <button class="btnPri" onclick="openCmp()">📊 比較</button>
      <button class="btnSec" onclick="addProp()">＋ 物件追加</button>
    </div>
  </div>
</div>

<!-- Compare modal -->
<div class="modal" id="cmpModal">
  <div class="modalHdr">
    <strong>📊 物件比較一覧</strong>
    <button class="closeBtn" onclick="closeCmp()">✕ 閉じる</button>
  </div>
  <div class="cmpWrap" id="cmpTarget"></div>
</div>

<!-- Share overlay -->
<div class="overlay" id="shareOverlay">
  <div class="sheet">
    <div class="sheetTitle">📤 データを共有・バックアップ</div>
    <div class="sheetBtns">
      <button class="sheetBtn" onclick="doExport()">💾 JSONファイルとして保存（バックアップ）</button>
      <button class="sheetBtn" onclick="doImportTrigger()">📂 JSONファイルを読み込む（復元）</button>
      <input type="file" id="importFile" style="display:none" accept=".json" onchange="doImport(this)">
    </div>
    <button class="sheetCancel" onclick="closeShare()">キャンセル</button>
  </div>
</div>

<script>
/* ══════════════════════════════
   CONSTANTS
══════════════════════════════ */
const SK = 'naiken_v4';

const SECS = [
  { id:'money', t:'💰 費用', items:[
    {id:'rent',   l:'家賃（管理費込）',     type:'text', p:'例: 8.5万円'},
    {id:'init',   l:'初期費用概算',         type:'text', p:'例: 35万円'},
    {id:'upd',    l:'更新料',              type:'text', p:'例: 1ヶ月 / 2年ごと'},
  ]},
  { id:'access', t:'📍 アクセス', items:[
    {id:'sta',    l:'最寄り駅',            type:'text', p:'例: 渋谷駅'},
    {id:'walk',   l:'駅徒歩',             type:'chip', opts:['1〜3分','4〜5分','6〜8分','9〜10分','11〜15分','16分以上']},
    {id:'layout', l:'間取り',             type:'chip', opts:['1R','1K','1DK','1LDK','2K','2DK','2LDK','3LDK〜']},
    {id:'area',   l:'専有面積',           type:'text', p:'例: 35㎡'},
    {id:'floor',  l:'階数',              type:'chip', opts:['1階','2〜3階','4〜6階','7階以上','最上階']},
    {id:'age',    l:'築年数',            type:'chip', opts:['新築','1〜5年','6〜10年','11〜20年','21〜30年','31年以上']},
  ]},
  { id:'room', t:'🏠 室内・設備', items:[
    {id:'sun',    l:'日当たり・向き',      type:'chip', opts:['南向き','東向き','西向き','北向き']},
    {id:'gas',    l:'ガス種別',           type:'chip', opts:['都市ガス','プロパン','オール電化']},
    {id:'net',    l:'ネット環境',         type:'chip', opts:['無料(高速)','無料(普通)','個別契約']},
    {id:'wash',   l:'洗濯機置場',         type:'chip', opts:['室内あり','バルコニー','なし']},
    {id:'ac',     l:'エアコン',           type:'chip', opts:['全室あり','一部あり','なし']},
    {id:'storage',l:'収納',             type:'chip', opts:['多い','普通','少ない']},
    {id:'bath',   l:'追い焚き・浴室乾燥', type:'chip', opts:['両方あり','追い焚きのみ','浴乾のみ','なし']},
    {id:'toilet', l:'温水洗浄便座',       type:'chip', opts:['あり','なし']},
  ]},
  { id:'bldg', t:'🏢 建物・共有部', items:[
    {id:'lock',   l:'オートロック',        type:'chip', opts:['あり','なし']},
    {id:'elev',   l:'エレベーター',        type:'chip', opts:['あり','なし']},
    {id:'dlv',    l:'宅配ボックス',        type:'chip', opts:['あり','なし','常時満杯気味']},
    {id:'bike',   l:'駐輪場',             type:'chip', opts:['あり(空)','あり(満)','なし']},
    {id:'trash',  l:'ゴミ置場',           type:'chip', opts:['敷地内24h','敷地内(朝のみ)','地域指定']},
    {id:'str',    l:'建物構造',           type:'chip', opts:['RC造','SRC造','木造','軽量鉄骨']},
  ]},
  { id:'env', t:'🔐 環境・セキュリティ', items:[
    {id:'cam',    l:'防犯カメラ',          type:'chip', opts:['あり','なし']},
    {id:'pos',    l:'部屋位置',           type:'chip', opts:['角部屋','中部屋','最上階','1階']},
    {id:'noise',  l:'騒音レベル',         type:'chip', opts:['静か','生活音あり','外が響く']},
    {id:'safe',   l:'夜道・治安',         type:'chip', opts:['安全','普通','注意が必要']},
    {id:'shop',   l:'買い物利便性',       type:'chip', opts:['徒歩5分内','徒歩10分圏','車が必要']},
  ]},
  { id:'msr', t:'📏 採寸メモ', items:[
    {id:'m_cur',  l:'カーテン 幅×高さ',   type:'text', p:'例: 180×200 cm'},
    {id:'m_fri',  l:'冷蔵庫 幅×奥行',    type:'text', p:'例: 65×70 cm'},
    {id:'m_wsh',  l:'洗濯機 幅×奥行',    type:'text', p:'例: 60×60 cm'},
    {id:'m_dor',  l:'玄関ドア 幅',        type:'text', p:'例: 90 cm'},
  ]},
  { id:'life', t:'🚃 通勤・生活', items:[
    {id:'cmut',   l:'通勤時間',           type:'chip', opts:['〜15分','15〜30分','30〜45分','45〜60分','60分超']},
    {id:'last',   l:'終電目安',           type:'chip', opts:['23時台','0時台','1時台以降','始発が早い']},
    {id:'sig',    l:'スマホ電波',         type:'chip', opts:['バリ4','普通','弱い']},
  ]},
  { id:'rating', t:'⭐ 評価', items:[
    {id:'s_room',  l:'室内・設備',         type:'star'},
    {id:'s_loc',   l:'立地・周辺環境',     type:'star'},
    {id:'s_mgmt',  l:'建物・管理状態',     type:'star'},
    {id:'s_price', l:'家賃とのバランス',   type:'star'},
    {id:'s_total', l:'総合評価',           type:'star'},
    {id:'memo',    l:'感想・特記事項',     type:'ta', p:'内見での気づき、懸念点、良かった点など...'},
  ]},
];

const STAR_LABELS = ['','△ 微妙','▲ まあまあ','○ 良い','◎ 良い','★ 最高'];
const STAR_IDS = ['s_room','s_loc','s_mgmt','s_price','s_total'];

/* ══════════════════════════════
   STATE
══════════════════════════════ */
let props=[], cflds=[], aIdx=0, openSecs=new Set(['money','access','rating']);

/* ══════════════════════════════
   STORAGE
══════════════════════════════ */
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(SK)||'null');
    if(d){
      props=d.props||[];
      cflds=d.cflds||[];
      openSecs=new Set(d.open||['money','access','rating']);
    }
  }catch(e){}
  if(!props.length) props.push(newProp());
  render();
}

function save(){
  localStorage.setItem(SK, JSON.stringify({props, cflds, open:[...openSecs]}));
}

function newProp(){
  return {id:Date.now(), name:'', data:{}, cdata:{}, photos:[]};
}

/* ══════════════════════════════
   ESCAPE
══════════════════════════════ */
function esc(s){
  return String(s||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ══════════════════════════════
   RENDER ALL
══════════════════════════════ */
function render(){
  renderTabs();
  renderPropHdr();
  renderPcView();
  renderMbView();
  renderSummary();
}

/* TABS */
function renderTabs(){
  document.getElementById('tabs').innerHTML=
    props.map((x,i)=>`<button class="tab${i===aIdx?' on':''}" onclick="switchTab(${i})">${esc(x.name)||'物件'+(i+1)}</button>`).join('')+
    `<button class="addTab" onclick="addProp()" title="物件を追加">+</button>`;
}

/* PROP HEADER */
function renderPropHdr(){
  const p=props[aIdx];
  document.getElementById('nameIn').value=p.name||'';
  const photos=p.photos||[];
  let html=photos.map((src,i)=>`
    <div class="photoWrap">
      <img class="photoThumb" src="${src}" alt="物件写真">
      <button class="photoDel" onclick="deletePhoto(${i})">×</button>
    </div>`).join('');
  if(photos.length<6){
    html+=`<label class="photoAdd">
      <span>📸</span><span>追加</span>
      <input type="file" style="display:none" accept="image/*" onchange="handlePhoto(this)">
    </label>`;
  }
  document.getElementById('photoGrid').innerHTML=html;
}

/* ── PC TABLE VIEW ── */
function renderPcView(){
  const p=props[aIdx];
  let html='';

  SECS.forEach(sec=>{
    html+=`<div class="pc-section">
      <div class="pc-sec-hdr">${sec.t}</div>
      <table class="pc-table">`;
    sec.items.forEach(item=>{
      const v=p.data[item.id]||'';
      html+=`<tr>
        <td class="lbl-col">${esc(item.l)}</td>
        <td class="inp-col">${buildInput(item, v, 'pc')}</td>
      </tr>`;
    });
    html+=`</table></div>`;
  });

  // Custom fields
  const cfBody=cflds.map((f,i)=>`
    <tr>
      <td class="lbl-col">
        <input class="cfLbl" style="width:100%;background:transparent;border:none;border-bottom:1px solid var(--bdr);border-radius:0;padding:3px 2px"
          type="text" value="${esc(f.l)}" placeholder="項目名"
          oninput="setCfLabel(${i},this.value)">
      </td>
      <td class="inp-col" style="display:flex;gap:6px;align-items:center">
        <input type="text" class="iIn" style="flex:1"
          value="${esc(p.cdata[f.id]||'')}"
          oninput="setCfVal(${i},this.value)" placeholder="入力...">
        <button class="cfDel" onclick="delCf(${i})">×</button>
      </td>
    </tr>`).join('');
  html+=`<div class="pc-section">
    <div class="pc-sec-hdr">✏️ 自由入力項目</div>
    <table class="pc-table">${cfBody}</table>
    <div style="padding:10px 14px">
      <button class="cfAdd" onclick="addCf()">＋ 項目を追加する</button>
    </div>
  </div>`;

  document.getElementById('pcView').innerHTML=html;
}

/* ── MOBILE CARD VIEW ── */
function renderMbView(){
  const p=props[aIdx];
  let html='';

  SECS.forEach(sec=>{
    const open=openSecs.has(sec.id);
    const body=sec.items.map(item=>{
      const v=p.data[item.id]||'';
      return `<div class="iRow">
        <label class="iLbl">${esc(item.l)}</label>
        ${buildInput(item, v, 'mb')}
      </div>`;
    }).join('');
    html+=`<div class="sec${open?' open':''}">
      <div class="secHdr" onclick="toggleSec('${sec.id}')">
        <span>${sec.t}</span><span class="arr">▼</span>
      </div>
      <div class="secBody">${body}</div>
    </div>`;
  });

  // Custom fields
  const cfOpen=openSecs.has('cf');
  const cfBody=cflds.map((f,i)=>`
    <div class="cfRow">
      <input class="cfLbl" type="text" value="${esc(f.l)}"
        placeholder="項目名" oninput="setCfLabel(${i},this.value)">
      <input type="text" class="iIn"
        value="${esc(p.cdata[f.id]||'')}"
        oninput="setCfVal(${i},this.value)" placeholder="入力...">
      <button class="cfDel" onclick="delCf(${i})">×</button>
    </div>`).join('');
  html+=`<div class="sec${cfOpen?' open':''}">
    <div class="secHdr" onclick="toggleSec('cf')">
      <span>✏️ 自由入力項目</span><span class="arr">▼</span>
    </div>
    <div class="secBody">${cfBody}
      <button class="cfAdd" onclick="addCf()">＋ 項目を追加する</button>
    </div>
  </div>`;

  document.getElementById('mbView').innerHTML=html;
}

/* ── BUILD INPUT HTML ── */
function buildInput(item, v, mode){
  if(item.type==='chip'){
    const cls=mode==='pc'?'chips-inline':'chips';
    return `<div class="${cls}">${item.opts.map(o=>
      `<div class="chip${v===o?' on':''}" onclick="setChip('${item.id}','${esc(o)}')">${esc(o)}</div>`
    ).join('')}</div>`;
  }
  if(item.type==='star'){
    const n=parseInt(v)||0;
    const stars=[1,2,3,4,5].map(i=>
      `<span class="star${i<=n?' on':''}" onclick="setStar('${item.id}',${i})">★</span>`
    ).join('');
    const lbl=n>0
      ?`<span class="starVal">${STAR_LABELS[n]}</span>`
      :`<span class="starVal" style="opacity:.4">タップして評価</span>`;
    return `<div class="stars">${stars}${lbl}</div>`;
  }
  if(item.type==='ta'){
    return `<textarea class="iIn"
      oninput="setData('${item.id}',this.value)"
      placeholder="${esc(item.p||'')}">${esc(v)}</textarea>`;
  }
  return `<input type="text" class="iIn"
    value="${esc(v)}"
    oninput="setData('${item.id}',this.value)"
    placeholder="${esc(item.p||'')}">`;
}

/* ── SUMMARY BAR ── */
function renderSummary(){
  const p=props[aIdx];

  // 総合評価
  const total=parseInt(p.data['s_total'])||0;
  document.getElementById('sumStar').textContent=
    total>0?'★'.repeat(total)+'☆'.repeat(5-total):'—';

  // 平均（全スター項目）
  const starVals=STAR_IDS.map(id=>parseInt(p.data[id])||0).filter(n=>n>0);
  const avg=starVals.length>0
    ?(starVals.reduce((a,b)=>a+b,0)/starVals.length).toFixed(1)
    :'—';
  document.getElementById('sumAvg').textContent=avg!=='—'?avg+'pt':'—';

  // 記入率（チップ・テキスト・スター全アイテム）
  const allItems=SECS.flatMap(s=>s.items);
  const filled=allItems.filter(item=>(p.data[item.id]||'')!=='').length;
  const pct=Math.round(filled/allItems.length*100);
  document.getElementById('sumPctLbl').textContent=`記入率 ${pct}%`;
  document.getElementById('sumProgress').style.width=pct+'%';
}

/* ══════════════════════════════
   EVENT HANDLERS
══════════════════════════════ */
function switchTab(i){aIdx=i;render();window.scrollTo(0,0);}
function addProp(){props.push(newProp());aIdx=props.length-1;save();render();}
function updateName(v){props[aIdx].name=v;save();renderTabs();}
function setData(id,v){props[aIdx].data[id]=v;save();renderSummary();}

function setChip(id,opt){
  props[aIdx].data[id]=(props[aIdx].data[id]===opt?'':opt);
  save();renderPcView();renderMbView();renderSummary();
}
function setStar(id,n){
  props[aIdx].data[id]=(props[aIdx].data[id]==String(n)?'':String(n));
  save();renderPcView();renderMbView();renderSummary();
}
function toggleSec(id){
  openSecs.has(id)?openSecs.delete(id):openSecs.add(id);
  save();renderMbView();
}

/* Photos */
function handlePhoto(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const sc=400/Math.max(img.width,img.height);
      c.width=img.width*sc;c.height=img.height*sc;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      if(!props[aIdx].photos) props[aIdx].photos=[];
      props[aIdx].photos.push(c.toDataURL('image/jpeg',.55));
      save();renderPropHdr();
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(f);
}
function deletePhoto(i){props[aIdx].photos.splice(i,1);save();renderPropHdr();}

/* Custom fields */
function addCf(){cflds.push({id:'cf_'+Date.now(),l:''});openSecs.add('cf');save();render();}
function setCfLabel(i,v){cflds[i].l=v;save();}
function setCfVal(i,v){props[aIdx].cdata[cflds[i].id]=v;save();}
function delCf(i){cflds.splice(i,1);save();render();}

/* Delete prop */
function deleteProp(){
  if(props.length===1){alert('最後の1件は削除できません');return;}
  if(!confirm(`「${props[aIdx].name||'物件'+(aIdx+1)}」を削除しますか？`))return;
  props.splice(aIdx,1);aIdx=Math.max(0,aIdx-1);save();render();
}

/* ══════════════════════════════
   COMPARE MODAL
══════════════════════════════ */
function openCmp(){
  const allItems=SECS.flatMap(s=>s.items);
  let h=`<table class="cmpTbl"><thead><tr><th class="lc">項目</th>`;
  props.forEach((p,i)=>h+=`<th>${esc(p.name)||'物件'+(i+1)}</th>`);
  h+=`</tr></thead><tbody>`;

  // 写真行
  h+=`<tr><td class="lc">写真</td>`;
  props.forEach(p=>{
    const ph=(p.photos||[]);
    h+=`<td>${ph.length?`<img src="${ph[0]}" class="cmpPhoto" alt="物件写真">`:'—'}</td>`;
  });
  h+=`</tr>`;

  allItems.forEach(item=>{
    h+=`<tr><td class="lc">${esc(item.l)}</td>`;
    props.forEach(p=>{
      const v=p.data[item.id]||'';
      let disp=esc(v)||'—';
      if(item.type==='star'&&v) disp='★'.repeat(parseInt(v))+'☆'.repeat(5-parseInt(v));
      h+=`<td>${disp}</td>`;
    });
    h+=`</tr>`;
  });

  cflds.forEach(f=>{
    h+=`<tr><td class="lc">${esc(f.l)||'(カスタム)'}</td>`;
    props.forEach(p=>h+=`<td>${esc(p.cdata[f.id])||'—'}</td>`);
    h+=`</tr>`;
  });

  h+=`</tbody></table>`;
  document.getElementById('cmpTarget').innerHTML=h;
  document.getElementById('cmpModal').style.display='block';
  document.body.style.overflow='hidden';
}
function closeCmp(){
  document.getElementById('cmpModal').style.display='none';
  document.body.style.overflow='';
}

/* ══════════════════════════════
   SHARE / BACKUP
══════════════════════════════ */
function openShare(){document.getElementById('shareOverlay').classList.add('vis');}
function closeShare(){document.getElementById('shareOverlay').classList.remove('vis');}

function doExport(){
  const b=new Blob([JSON.stringify({props,cflds},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=`naiken_${new Date().toISOString().slice(0,10)}.json`;
  a.click();closeShare();
}
function doImportTrigger(){document.getElementById('importFile').click();}
function doImport(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!confirm('現在のデータを上書きしますか？'))return;
      props=d.props||[];cflds=d.cflds||[];aIdx=0;
      save();render();closeShare();
    }catch{alert('読み込みに失敗しました');}
  };
  r.readAsText(f);
}

/* ══════════════════════════════
   INIT
══════════════════════════════ */
load();
</script>
</body>
</html>
